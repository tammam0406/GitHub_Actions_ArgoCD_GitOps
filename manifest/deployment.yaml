apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: tammam95/my-app:03287220819ffdad4a95a4ce7d720d1661adb651
        ports:
        - containerPort: 3000

