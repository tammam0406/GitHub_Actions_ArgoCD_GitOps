apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: tammam95/my-app:2c1159dae18a2c43e0173a64b02eaad2a6c67574
        ports:
        - containerPort: 3000

